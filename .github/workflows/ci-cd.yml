name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ── Permissions ───────────────────────────────────────────────────────────────
# Read-only default; the pages and release jobs grant their own write scopes.
permissions:
  contents: read

# Shared workflows are pinned to a github-workflows release, not to @main: the
# Pages and release jobs hold write tokens, and a change pushed to that repo's
# main would otherwise reach them unreviewed. Each github-workflows release
# opens the bump PR here (its propagate-release workflow); Renovate ignores
# these pins (the shared preset github>KevinDeBenedetti/renovate-config).
jobs:
  # ── Workflow validation ────────────────────────────────────────────────────
  shell:
    name: Workflow CI
    uses: KevinDeBenedetti/github-workflows/.github/workflows/ci-shell.yml@v0.55.0
    with:
      run-shellcheck: false
      run-actionlint: true
      actionlint-paths: .github/workflows/
      run-bats: false

  # ── prek hooks (server-side) ───────────────────────────────────────────────
  # Re-runs prek.toml for changes that never went through the local hooks
  # (Renovate PRs, web edits, --no-verify pushes): file hygiene, oxlint and
  # the docs link / Vue interpolation checks.
  prek:
    name: prek
    uses: KevinDeBenedetti/github-workflows/.github/workflows/ci-prek.yml@v0.55.0
    permissions:
      contents: read

  # ── TypeScript lint + typecheck + test + build ─────────────────────────────
  node:
    name: Node CI
    uses: KevinDeBenedetti/github-workflows/.github/workflows/ci-node.yml@v0.55.0
    with:
      node-version: '22'
      run-lint: true
      run-typecheck: true
      run-test: true
      run-build: true
      run-link-check: false
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  # ── Security ───────────────────────────────────────────────────────────────
  security:
    name: Security
    if: github.event_name == 'pull_request'
    uses: KevinDeBenedetti/github-workflows/.github/workflows/security.yml@v0.55.0
    with:
      run-node-audit: true
      run-python-audit: false
      run-secret-scan: true
      run-codeql: false
    permissions:
      security-events: write
      actions: read
      contents: read
      pull-requests: read

  # ── GitHub Pages deploy ────────────────────────────────────────────────────
  # Defined here: github-workflows dropped its cd-pages workflow in v0.46.0.
  pages-build:
    name: Pages build
    needs: [shell, node]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The build runs the project's install and build scripts: read-only token.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: KevinDeBenedetti/github-workflows/.github/actions/setup-node@v0.55.0
        with:
          node-version: '22'

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .vitepress/dist

  pages:
    name: Pages
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One deployment at a time, never cancelled: deploy-pages would leave a
    # half-published site.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write # publish the Pages deployment
      id-token: write # OIDC token deploy-pages uses to authenticate
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # ── Release ────────────────────────────────────────────────────────────────
  # release-please (config in .github/release/): on each push to main it opens
  # or updates the release PR; merging that PR tags vX.Y.Z and publishes the
  # GitHub Release and CHANGELOG.md. Only commits that land in the changelog
  # (feat, fix, perf, revert) open one.
  # Runs on GITHUB_TOKEN alone (no App, no PAT): the release PR is authored by
  # github-actions[bot]; its CI runs wait for "Approve workflows to run".
  release:
    name: Release
    needs: [shell, prek, node]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: KevinDeBenedetti/github-workflows/.github/workflows/release.yml@v0.55.0
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # Needs "Allow GitHub Actions to create and approve pull requests". The
    # alias tags (v0, v0.<minor>) are also made as github-actions[bot], set
    # here so the GIT_USER_NAME / GIT_USER_EMAIL repo variables are never read.
    with:
      git-user-name: github-actions[bot]
      git-user-email: 41898282+github-actions[bot]@users.noreply.github.com
