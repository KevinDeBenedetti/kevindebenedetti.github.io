name: Docs poll

# Pull-based replacement for the cross-repo `repository_dispatch`: checks every
# 12 hours whether any project's docs/ changed since the last deploy and, if so,
# triggers CI/CD. Needs no secret — only public data is read, and
# `workflow_dispatch` is one of the events GITHUB_TOKEN is allowed to trigger.

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

concurrency:
  group: docs-poll
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  poll:
    name: Check for docs changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Compare live site with source repos
        id: check
        run: bun scripts/check-docs-changes.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger CI/CD
        if: steps.check.outputs.changed == 'true'
        run: gh workflow run ci-cd.yml --ref "${{ github.event.repository.default_branch }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
