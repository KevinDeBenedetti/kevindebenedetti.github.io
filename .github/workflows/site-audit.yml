name: Site audit

# Weekly checks of the live site, from GitHub-hosted runners (what visitors and
# search engines see):
#   seo        : broken links and redirects; missing or duplicate title,
#                description, h1 and canonical tags
#   lighthouse : Lighthouse on every page (performance, accessibility, best
#                practices, SEO)
# A failing check fails the run, so GitHub's failure email is the alert.
# Reports are kept as run artifacts.

on:
  schedule:
    - cron: '11 6 * * 1' # Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo:
    name: SEO crawl
    uses: KevinDeBenedetti/github-workflows/.github/workflows/seo-crawl.yml@v0.29.0
    permissions:
      contents: read
    with:
      site: https://kevindebenedetti.github.io
      # Links a crawler cannot judge, comma-separated:
      #   github.com : most outbound links; answers a crawl with 429s, and
      #                linkinator does not retry
      #   medium.com : answers any non-browser client with a 403
      #   localhost  : dev-server URLs in the docs, never reachable
      skip: '^https://github\.com/,^https://medium\.com/,^https?://(localhost|127\.0\.0\.1)[:/]'

  lighthouse:
    name: Lighthouse
    uses: KevinDeBenedetti/github-workflows/.github/workflows/perf-unlighthouse.yml@v0.27.0
    permissions:
      contents: read
    with:
      site: https://kevindebenedetti.github.io
      # Loose start; raise it once a few runs have shown the real scores.
      budget: 75
